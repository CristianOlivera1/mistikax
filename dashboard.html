const customers = () => { const m = {}; DB.orders.forEach(o => { const c = m[o.email] ||= { n: o.cust, e: o.email, ph: o.phone, city: o.city, orders: 0, spent: 0, last: o.date }; c.orders++; if (o.status !== 'cancelado') c.spent += oTotal(o); if (o.date > c.last) c.last = o.date; }); return Object.values(m); };
function setStatus(o, st) {

}

const fld = (l, n, v = '', o = {}) => `<div class="${o.cls || ''}"><label class="lbl" for="f-${n}">${l}</label>${o.area ? `<textarea id="f-${n}" name="${n}" rows="${o.area}" class="inp" ${o.ph ? `placeholder="${o.ph}"` : ''}>${esc(v)}</textarea>` : o.opts ? `<select id="f-${n}" name="${n}" class="inp">${o.opts.map(x => `<option value="${x[0]}" ${x[0] == v ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>` : `<input id="f-${n}" name="${n}" type="${o.t || 'text'}" value="${esc(v)}" class="inp ${o.mono ? 'font-mono' : ''}" ${o.ph ? `placeholder="${o.ph}"` : ''} ${o.req ? 'required' : ''} ${o.step ? `step="${o.step}"` : ''}>`}${o.hint ? `<p class="hint">${o.hint}</p>` : ''}</div>`;
const sw = (l, n, on, hint) => `<label class="flex items-start justify-between gap-4 py-1"><span><span class="block font-medium">${l}</span>${hint ? `<span class="hint !mt-0.5 block">${hint}</span>` : ''}</span><input type="checkbox" name="${n}" class="sw mt-0.5" ${on ? 'checked' : ''}></label>`;
const page = (t, d, act, body, back) => `${back ? `<a href="#${back}" class="mb-3 inline-flex items-center gap-1 text-mute hover:text-ink">${ic('back')}Volver</a>` : ''}<div class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1>${t}</h1>${d ? `<p class="mt-1 text-mute">${d}</p>` : ''}</div><div class="flex gap-2">${act || ''}</div></div>${body}`;

const stat = (l, v, s) => `<div class="card p-5"><p class="text-mute">${l}</p><p class="mt-2 text-2xl font-semibold tracking-tight">${v}</p><p class="mt-1 text-xs text-mute">${s || '&nbsp;'}</p></div>`;

/* ================== VISTAS ================== */
const F = { range: '30', pq: '', pcat: '', page: '', pst: '', otab: 'todos', oq: '', cq: '' };

function Home() {
  const days = +F.range, cur = DB.daily.slice(-days), sum = cur.reduce((a, b) => a + b, 0);

  const ok = DB.orders.filter(o => o.status !== 'cancelado'), ticket = ok.reduce((a, o) => a + oTotal(o), 0) / Math.max(1, ok.length);
  const delta = prev ? Math.round((sum / prev - 1) * 100) : null;
  const W = 600, H = 180, mx = Math.max(...cur), pts = cur.map((v, i) => [i / (cur.length - 1) * W, H - 10 - v / mx * (H - 30)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const top = [...DB.products].sort((a, b) => b.sold - a.sold).slice(0, 5), low = lowList().slice(0, 4);
  return page('Resumen', `Actividad de ${DB.cfg.name}`, `<select data-f="range" class="inp !w-auto">${[['7', 'Últimos 7 días'], ['14', 'Últimos 14 días'], ['30', 'Últimos 30 días']].map(o => `<option value="${o[0]}" ${F.range === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select><a href="#/productos/nuevo" class="btn btn-b">${ic('plus')}Nuevo producto</a>`, `
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    ${stat('Ventas', money(sum), delta === null ? `Últimos ${days} días` : `<span class="${delta >= 0 ? 'text-ok' : 'text-bad'}">${delta >= 0 ? '+' : ''}${delta}%</span> vs. periodo anterior`)}
    ${stat('Pedidos', Math.round(sum / ticket), `Últimos ${days} días`)}
    ${stat('Ticket promedio', money(ticket))}
    ${stat('Por atender', pend(), `<a href="#/pedidos" class="underline">Ver pedidos pendientes</a>`)}
  </div>
  <div class="mt-4 grid gap-4 lg:grid-cols-3">
    <div class="card p-5 lg:col-span-2">
      <div class="flex items-center justify-between"><h2 class="font-medium">Ventas diarias</h2><span class="mono text-mute">${fdate(dl(days - 1))} – hoy</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="mt-4 w-full" role="img" aria-label="Gráfico de ventas diarias"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0070f3" stop-opacity=".18"/><stop offset="1" stop-color="#0070f3" stop-opacity="0"/></linearGradient></defs>
        ${[0, .5, 1].map(t => `<line x1="0" x2="${W}" y1="${10 + t * (H - 30)}" y2="${10 + t * (H - 30)}" stroke="#eaeaea"/>`).join('')}
        <polygon points="0,${H - 10} ${line} ${W},${H - 10}" fill="url(#g)"/><polyline points="${line}" fill="none" stroke="#0070f3" stroke-width="2" stroke-linejoin="round"/>
        ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${cur.length > 14 ? 3 : 4}" fill="#fff" stroke="#0070f3" stroke-width="1.5"><title>${fdate(dl(days - 1 - i))}: ${money(cur[i])}</title></circle>`).join('')}</svg>
    </div>
    <div class="card"><div class="border-b border-line px-5 py-4"><h2 class="font-medium">Necesita atención</h2></div><div class="divide-y divide-line">
      <a href="#/pedidos" class="flex items-center justify-between px-5 py-3 hover:bg-sub"><span>Pedidos pendientes</span><span class="mono">${pend()}</span></a>
      ${low.map(p => `<a href="#/productos/${p.id}" class="flex items-center gap-3 px-5 py-3 hover:bg-sub">${thumb(p, 'size-7')}<span class="min-w-0 flex-1 truncate">${esc(p.n)}</span>${sBdg(p)}</a>`).join('') || '<p class="px-5 py-4 text-mute">Todo el stock está en orden.</p>'}
    </div></div>
  </div>

    <div class="card lg:col-span-2"><div class="flex items-center justify-between border-b border-line px-5 py-4"><h2 class="font-medium">Pedidos recientes</h2><a href="#/pedidos" class="btn">Ver todos</a></div>
      ${tbl(['Pedido', 'Cliente', 'Estado', 'Total'], DB.orders.slice(0, 5).map(o => `<tr class="row cursor-pointer" data-go="/pedidos/${o.id}"><td class="td mono">#${o.id}</td><td class="td">${esc(o.cust)}</td><td class="td">${oBdg(o.status)}</td><td class="td">${money(oTotal(o))}</td></tr>`))}</div>

  </div>`);
}

const Media = () => page('Medios', `${DB.media.length} archivos`, `<label class="btn btn-b cursor-pointer">${ic('upload')}Subir imagen<input type="file" accept="image/*" multiple class="sr-only" data-upload="media"></label>`, `<div class="grid grid-cols-2 gap-4 sm:grid-cols-4 lg:grid-cols-5">${DB.media.map((s, i) => `<div class="card group overflow-hidden"><div class="aspect-square bg-hover">${im(s, 'size-full object-cover')}</div><div class="flex gap-1 p-2"><button class="btn flex-1" data-act="mcopy" data-v="${i}">${ic('copy', 14)}Copiar URL</button><button class="btn btn-i btn-r" data-act="mdel" data-v="${i}" aria-label="Eliminar">${ic('trash', 14)}</button></div></div>`).join('') || empty('Sin archivos', 'Sube tu primera imagen.')}</div>`);

const NotFound = () => page('No encontrado', 'Esta sección no existe.', `<a href="#/" class="btn btn-b">Ir al resumen</a>`);

/* ================== ROUTER ================== */
const LISTS = { productos: productsTable, pedidos: ordersTable, clientes: customersTable };
let keep = false;
function draw() {
  const seg = (location.hash.slice(1) || '/').split('/').filter(Boolean), k = seg[0] || 'home', id = seg[1];
  if (k !== 'productos' || id !== draft?._id) { if (!(k === 'productos' && id)) draft = null; }
  const V = { home: Home, productos: () => id ? ProductEditor(id) : Products(), categorias: Categories, inventario: Inventory, pedidos: () => id ? OrderDetail(id) : Orders(), clientes: Customers, descuentos: Coupons, portada: Portada, paginas: () => id ? PageEditor(id) : Pages(), faq: Faq, medios: Media, config: Config };
  $('#view').innerHTML = (V[k] || NotFound)();
  $('#crumb').innerHTML = `<a href="#/" class="hover:text-ink">Panel</a>${k !== 'home' ? `<span>/</span><a href="#/${k}" class="${id ? 'hover:text-ink' : 'font-medium text-ink'}">${TITLES[k] || '—'}</a>` : ''}${id ? `<span>/</span><span class="truncate font-medium text-ink">${id === 'nuevo' ? 'Nuevo' : esc(id)}</span>` : ''}`;
  renderNav(k); $('#dot').style.display = pend() ? '' : 'none'; document.title = `${TITLES[k] || 'Panel'} | ${DB.cfg.name}`;
  $('#side').classList.add('-translate-x-full'); $('#scrim').classList.add('hidden');
  if (!keep) scrollTo(0, 0); keep = false;
}
const redraw = () => { keep = true; draw(); };

/* ================== ACCIONES ================== */
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; persist(); redraw(); };
const readFile = (f, cb) => { const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f); };
const acts = {
  menu: () => { $('#side').classList.toggle('-translate-x-full'); $('#scrim').classList.toggle('hidden'); },
  mclose: closeModal,
  user: () => toast('Sesión de administrador (demo)'),
  notif: () => toast(pend() ? `${pend()} pedidos pendientes y ${lowList().length} productos con poco stock` : 'No tienes notificaciones'),
  cmd: () => { $('#cmd').showModal(); $('#cmdq').value = ''; cmdRender(); $('#cmdq').focus(); },
  otab: v => { F.otab = v; redraw(); },
  ctab: v => { F.ctab = v; redraw(); },
  ostat: v => { const [id, st] = v.split('|'), o = DB.orders.find(x => x.id == id); setStatus(o, st); toast(`Pedido #${id}: ${ST[st][0].toLowerCase()}`); redraw(); },
  /* productos */
  pdel: v => { const p = DB.products.find(x => x.id === v); modal('Eliminar producto', `<p>¿Eliminar <b>${esc(p.n)}</b>? Esta acción no se puede deshacer. Si solo quieres ocultarlo, cámbialo a <i>Archivado</i>.</p>`, 'pdel', v, 'Eliminar'); },
  pdup: v => { const p = structuredClone(DB.products.find(x => x.id === v)); p.id = p.id + '-copia'; p.n += ' (copia)'; p.status = 'borrador'; DB.products.unshift(p); persist(); toast('Producto duplicado como borrador'); redraw(); },
  psave: () => {
    const d = draft; if (!d.n.trim() || !(+d.price > 0)) return toast('Completa el nombre y un precio válido');
    const o = { ...d, price: +d.price, old: +d.old || 0, stock: Object.fromEntries(sizesFor(catOf(d.cat).type, d.age).map(s => [s, +d.stock[s] || 0])) }; delete o._id;
    if (d._id === 'nuevo') { o.id = slug(o.n) + (DB.products.some(p => p.id === slug(o.n)) ? '-' + Date.now() % 1000 : ''); DB.products.unshift(o); } else Object.assign(DB.products.find(p => p.id === d._id), o);
    persist(); toast('Producto guardado'); draft = null; location.hash = '/productos';
  },
  imain: v => { const [x] = draft.imgs.splice(+v, 1); draft.imgs.unshift(x); $('#imgs').innerHTML = imgsBox(); },
  idel: v => { draft.imgs.splice(+v, 1); $('#imgs').innerHTML = imgsBox(); },
  iurl: () => { const i = $('#imgurl'); if (i.value.trim()) { draft.imgs.push(i.value.trim()); $('#imgs').innerHTML = imgsBox(); } },
  /* categorías */
  catform: v => { const c = v ? catOf(v) : { name: '', type: 'ropa' }; modal(v ? 'Editar categoría' : 'Nueva categoría', fld('Nombre', 'name', c.name, { req: 1 }) + fld('Tipo de tallas', 'type', c.type, { opts: [['ropa', 'Ropa (S, M, L...)'], ['calzado', 'Calzado (numeración)'], ['unica', 'Talla única']] }), 'cat', v || ''); },
  catdel: v => { const n = DB.products.filter(p => p.cat === v).length; if (n) return toast(`No se puede eliminar: tiene ${n} productos`); DB.cats = DB.cats.filter(c => c.id !== v); persist(); toast('Categoría eliminada'); redraw(); },
  /* descuentos */
  cpform: v => { const c = v !== undefined ? DB.coupons[v] : { code: '', type: '%', value: '', exp: '2026-12-31' }; modal(v !== undefined ? 'Editar descuento' : 'Nuevo descuento', fld('Código', 'code', c.code, { req: 1, mono: 1 }) + `<div class="grid grid-cols-2 gap-4">${fld('Tipo', 'type', c.type, { opts: [['%', 'Porcentaje'], ['S/', 'Monto fijo']] })}${fld('Valor', 'value', c.value, { t: 'number', req: 1, step: '0.01' })}</div>` + fld('Vence', 'exp', c.exp, { t: 'date' }), 'coupon', v ?? ''); },
  cpdel: v => { DB.coupons.splice(+v, 1); persist(); toast('Descuento eliminado'); redraw(); },
  /* contenido */
  secmv: v => { const [i, d] = v.split('|'); move(DB.banner.sections, +i, +d); },
  pgform: () => modal('Nueva página', fld('Título', 't', '', { req: 1 }), 'pgnew'),
  pgdel: v => { DB.pages = DB.pages.filter(p => p.id !== v); persist(); toast('Página eliminada'); redraw(); },
  faqform: v => { const f = v !== undefined ? DB.faq[v] : { q: '', a: '' }; modal(v !== undefined ? 'Editar pregunta' : 'Nueva pregunta', fld('Pregunta', 'q', f.q, { req: 1 }) + fld('Respuesta', 'a', f.a, { area: 4, req: 1 }), 'faq', v ?? ''); },
  faqmv: v => { const [i, d] = v.split('|'); move(DB.faq, +i, +d); },
  faqdel: v => { DB.faq.splice(+v, 1); persist(); redraw(); },
  mcopy: v => { navigator.clipboard?.writeText(DB.media[v]); toast('URL copiada'); },
  mdel: v => { DB.media.splice(+v, 1); persist(); redraw(); },
  /* sistema */
  tmform: v => { const t = v !== undefined ? DB.team[v] : { n: '', e: '', role: 'Editor' }; modal(v !== undefined ? 'Editar miembro' : 'Invitar miembro', fld('Nombre', 'n', t.n, { req: 1 }) + fld('Correo', 'e', t.e, { t: 'email', req: 1 }) + fld('Rol', 'role', t.role, { opts: [['Administrador', 'Administrador'], ['Editor', 'Editor'], ['Ventas', 'Ventas']] }), 'member', v ?? ''); },
  tmdel: v => { DB.team.splice(+v, 1); persist(); redraw(); },
  export: () => { const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' })), download: 'mistikax-datos.json' }); a.click(); },
  reset: () => modal('Restablecer datos', '<p>Se borrarán todos los cambios y volverán los datos de ejemplo.</p>', 'reset', '', 'Restablecer'),
};
const saves = {
  pdel: (fd, id) => { DB.products = DB.products.filter(p => p.id !== id); persist(); closeModal(); toast('Producto eliminado'); location.hash = '/productos'; draw(); },
  cat: (fd, id) => { const n = fd.get('name').trim(); if (id) Object.assign(catOf(id), { name: n, type: fd.get('type') }); else DB.cats.push({ id: slug(n), name: n, type: fd.get('type') }); persist(); closeModal(); toast('Categoría guardada'); redraw(); },
  coupon: (fd, id) => { const c = { code: fd.get('code').toUpperCase().trim(), type: fd.get('type'), value: +fd.get('value'), exp: fd.get('exp') }; id !== '' ? Object.assign(DB.coupons[id], c) : DB.coupons.push({ ...c, uses: 0, on: true }); persist(); closeModal(); toast('Descuento guardado'); redraw(); },
  portada: fd => { const b = DB.banner; b.announce = { on: fd.has('aon'), text: fd.get('atext') }; b.hero = { title: fd.get('htitle'), sub: fd.get('hsub'), cta: fd.get('hcta'), link: fd.get('hlink'), img: fd.get('himg') }; persist(); toast('Portada actualizada'); redraw(); },
  pgnew: fd => { const t = fd.get('t').trim(); DB.pages.unshift({ id: slug(t), t, st: 'borrador', body: '', seo: '', d: new Date().toISOString() }); persist(); closeModal(); location.hash = '/paginas/' + slug(t); },
  page: (fd, id) => { Object.assign(DB.pages.find(p => p.id === id), { t: fd.get('t'), body: fd.get('body'), seo: fd.get('seo'), st: fd.get('st'), d: new Date().toISOString() }); persist(); toast('Página guardada'); },
  faq: (fd, id) => { const f = { q: fd.get('q'), a: fd.get('a') }; id !== '' ? Object.assign(DB.faq[id], f) : DB.faq.push(f); persist(); closeModal(); redraw(); },
  member: (fd, id) => { const t = { n: fd.get('n'), e: fd.get('e'), role: fd.get('role') }; id !== '' ? Object.assign(DB.team[id], t) : DB.team.push(t); persist(); closeModal(); toast('Equipo actualizado'); redraw(); },
  cfg: fd => { const c = DB.cfg; for (const [k, v] of fd) c[k] = ['ship', 'free', 'low'].includes(k) ? +v : v; ['card', 'transfer', 'cod', 'wallet'].forEach(k => { if (fd.has('tinfo') || fd.has('card') || document.querySelector('[name=card]')) c[k] = fd.has(k); }); persist(); toast('Configuración guardada'); redraw(); },
  reset: () => { localStorage.removeItem('mx_admin'); DB = makeSeed(); persist(); closeModal(); toast('Datos restablecidos'); location.hash = '/'; draw(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (t) return acts[t.dataset.act]?.(t.dataset.v);
  const g = e.target.closest('[data-go]'); if (g && !e.target.closest('button')) location.hash = g.dataset.go;
  const c = e.target.closest('[data-cmdgo]'); if (c) { $('#cmd').close(); location.hash = c.dataset.cmdgo; }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-save]'); if (!f) return; e.preventDefault(); saves[f.dataset.save]?.(new FormData(f), f.dataset.id, f); });
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) { F[d.f] = t.value; if (d.f === 'range') return redraw(); const l = LISTS[(location.hash.split('/')[1] || '')]; if (l && t.tagName === 'INPUT') $('#list').innerHTML = l(); }
  if (d.d && draft) { draft[d.d] = t.type === 'checkbox' ? t.checked : t.value; }
  if (d.stock && draft) { draft.stock[d.stock] = +t.value || 0; $('#stock').querySelector('b').textContent = Object.values(draft.stock).reduce((a, b) => a + b, 0); }
  if (d.inv) { const [id, s] = d.inv.split('|'), p = DB.products.find(x => x.id === id); p.stock[s] = Math.max(0, +t.value || 0); persist(); $(`[data-tot="${id}"]`).textContent = stockOf(p); $(`[data-sb="${id}"]`).innerHTML = sBdg(p); renderNav('inventario'); }
  if (d.live) $('#' + d.live).innerHTML = pv(t.value);
  if (d.note) { DB.orders.find(o => o.id == d.note).note = t.value; persist(); }
  if (t.id === 'cmdq') cmdRender();
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.f && t.tagName === 'SELECT') { F[d.f] = t.value; const l = LISTS[(location.hash.split('/')[1] || '')]; d.f === 'range' ? redraw() : l && ($('#list').innerHTML = l()); }
  if (d.d === 'cat' || d.d === 'age') { $('#stock').innerHTML = stockGrid(); }
  if (d.col && draft) { draft.colors = $$('[data-col]:checked').map(x => x.dataset.col); }
  if (d.cpon !== undefined) { DB.coupons[d.cpon].on = t.checked; persist(); toast(t.checked ? 'Descuento activado' : 'Descuento desactivado'); }
  if (d.sec !== undefined) { DB.banner.sections[d.sec].on = t.checked; persist(); }
  if (d.upload && t.files.length) [...t.files].forEach(f => readFile(f, url => {
    if (d.upload === 'draft') { draft.imgs.push(url); $('#imgs').innerHTML = imgsBox(); }
    else if (d.upload === 'hero') { DB.banner.hero.img = url; persist(); redraw(); }
    else { DB.media.unshift(url); persist(); redraw(); toast('Imagen subida'); }
  }));
  if (t.type === 'color') t.nextElementSibling.value = t.value;
});
function cmdRender() {
  const q = $('#cmdq').value.toLowerCase(), items = [...NAV.flatMap(g => g[1]).map(i => [i[0], i[1], i[2], 'Ir a']), ['Nuevo producto', '/productos/nuevo', 'plus', 'Acción'], ...DB.products.map(p => [p.n, '/productos/' + p.id, 'box', 'Producto']), ...DB.orders.map(o => ['Pedido #' + o.id + ' · ' + o.cust, '/pedidos/' + o.id, 'cart', 'Pedido'])].filter(i => i[0].toLowerCase().includes(q)).slice(0, 8);
  $('#cmdr').innerHTML = items.map(i => `<button data-cmdgo="${i[1]}" class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-left hover:bg-hover">${ic(i[2])}<span class="flex-1">${esc(i[0])}</span><span class="text-xs text-soft">${i[3]}</span></button>`).join('') || '<p class="p-4 text-center text-mute">Sin resultados</p>';
}
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); acts.cmd(); } });
$('#cmdq').addEventListener('keydown', e => { if (e.key === 'Enter') $('#cmdr button')?.click(); });
addEventListener('hashchange', draw);

$$('[data-ic]').forEach(el => el.innerHTML = ic(el.dataset.ic));
draw();
</script>
</body>
</html>
